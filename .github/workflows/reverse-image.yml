name: Reverse image lookup

on:
  workflow_dispatch:
  pull_request:

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and upscale JPEG
        run: |
          python - <<'PY'
          import base64, re, pathlib
          text = pathlib.Path('ctf-photo.svg').read_text()
          data = re.search(r'base64,([^\"]+)', text).group(1)
          pathlib.Path('photo-small.jpg').write_bytes(base64.b64decode(data))
          PY
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq imagemagick || true
          if command -v magick >/dev/null 2>&1; then
            magick photo-small.jpg -resize 800x -quality 95 photo.jpg || true
          elif command -v convert >/dev/null 2>&1; then
            convert photo-small.jpg -resize 800x -quality 95 photo.jpg || true
          fi
          if [ ! -s photo.jpg ]; then cp photo-small.jpg photo.jpg; fi

      - name: Upload temporary public JPEG
        run: |
          B64="$(base64 -w0 photo.jpg)"
          curl -sS -X POST \
            -F 'key=6d207e02198a847aa98d0a2a901485a5' \
            -F "source=$B64" \
            -F 'format=json' \
            'https://freeimage.host/api/1/upload' \
            -o freeimage.json
          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('freeimage.json').read_text())
          im=d.get('image',{})
          url=im.get('url') or im.get('display_url') or im.get('url_viewer') or ''
          pathlib.Path('public-url.txt').write_text(url)
          print('PUBLIC_URL='+url)
          PY

      - name: Render Google Lens with Chromium
        continue-on-error: true
        run: |
          python -m pip install -q selenium
          which google-chrome || true
          google-chrome --version || true
          python - <<'PY'
          import pathlib, time, urllib.parse, re, json
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          image_url=pathlib.Path('public-url.txt').read_text().strip()
          lens='https://lens.google.com/uploadbyurl?url='+urllib.parse.quote(image_url,safe='')+'&ep=subb'
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1600,1200')
          opts.add_argument('--lang=en-US')
          opts.add_argument('--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36')
          driver=webdriver.Chrome(options=opts)
          try:
              driver.get(lens)
              time.sleep(15)
              pathlib.Path('lens-rendered.html').write_text(driver.page_source,encoding='utf-8')
              driver.save_screenshot('lens-rendered.png')
              print('FINAL_URL='+driver.current_url)
              print('TITLE='+driver.title)
              print('BODY_TEXT_START')
              text=driver.find_element(By.TAG_NAME,'body').text
              print(text[:25000])
              print('BODY_TEXT_END')
              links=[]
              for a in driver.find_elements(By.TAG_NAME,'a'):
                  href=a.get_attribute('href')
                  label=(a.text or '').strip()
                  if href:
                      links.append({'text':label[:300],'href':href})
              pathlib.Path('lens-links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2),encoding='utf-8')
              for x in links[:300]:
                  print('LINK',repr(x['text']),x['href'])
          finally:
              driver.quit()
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reverse-search-results
          if-no-files-found: warn
          path: |
            photo.jpg
            freeimage.json
            public-url.txt
            lens-rendered.html
            lens-rendered.png
            lens-links.json
