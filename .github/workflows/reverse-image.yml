name: Lenso reverse image lookup

on:
  workflow_dispatch:
  pull_request:

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and enlarge image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          python - <<'PY'
          import base64, re, pathlib
          text = pathlib.Path('ctf-photo.svg').read_text()
          data = re.search(r'base64,([^\"]+)', text).group(1)
          pathlib.Path('photo-small.jpg').write_bytes(base64.b64decode(data))
          PY
          convert photo-small.jpg -resize 1200x -quality 96 photo.jpg
          identify photo.jpg

      - name: Search with lenso.ai
        continue-on-error: true
        run: |
          python -m pip install -q selenium
          python - <<'PY'
          import json, pathlib, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1600,1200')
          opts.add_argument('--lang=en-US')
          opts.add_argument('--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36')
          opts.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})

          driver=webdriver.Chrome(options=opts)
          driver.execute_cdp_cmd('Network.enable', {})
          wait=WebDriverWait(driver,30)
          try:
              driver.get('https://lenso.ai/en')
              time.sleep(5)

              # Dismiss Cookiebot overlay when present.
              try:
                  allow=wait.until(EC.presence_of_element_located((By.XPATH,"//*[self::button or self::a][normalize-space()='Allow all']")))
                  driver.execute_script('arguments[0].click()',allow)
                  print('COOKIE_ACCEPTED')
                  time.sleep(2)
              except Exception as e:
                  print('COOKIE_SKIP',type(e).__name__)

              file_input=wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'input[type=file]')))
              image_path=str(pathlib.Path('photo.jpg').resolve())
              file_input.send_keys(image_path)
              print('UPLOADED',image_path)

              privacy=wait.until(EC.presence_of_element_located((By.ID,'privacy-policy')))
              driver.execute_script('arguments[0].click()',privacy)
              print('PRIVACY_CHECKED',privacy.is_selected())
              time.sleep(1)

              perform=wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'button.perfom-search-btn')))
              print('PERFORM_DISABLED',perform.get_attribute('disabled'))
              driver.execute_script('arguments[0].click()',perform)
              print('PERFORM_CLICKED')

              old_url=driver.current_url
              for sec in range(1,91):
                  time.sleep(1)
                  if sec in (5,10,20,30,45,60,75,90):
                      print('WAIT',sec,'URL',driver.current_url,'TITLE',driver.title)
                  if '/search/' in driver.current_url or '/results/' in driver.current_url:
                      if sec >= 20:
                          break
              time.sleep(10)

              pathlib.Path('lenso-results.html').write_text(driver.page_source,encoding='utf-8')
              driver.save_screenshot('lenso-results.png')
              body=driver.find_element(By.TAG_NAME,'body').text
              pathlib.Path('lenso-body.txt').write_text(body,encoding='utf-8')
              print('FINAL_URL',driver.current_url)
              print('BODY_START')
              print(body[:80000])
              print('BODY_END')

              links=[]
              for a in driver.find_elements(By.TAG_NAME,'a'):
                  href=a.get_attribute('href')
                  text=(a.text or '').strip()
                  if href: links.append({'text':text[:500],'href':href})
              pathlib.Path('lenso-links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2),encoding='utf-8')
              for x in links[:1000]: print('LINK',repr(x['text']),x['href'])

              perf=driver.get_log('performance')
              pathlib.Path('performance.json').write_text(json.dumps(perf),encoding='utf-8')
              seen=[]
              for entry in perf:
                  try:
                      msg=json.loads(entry['message'])['message']
                      if msg['method']=='Network.responseReceived':
                          p=msg['params']
                          url=p['response']['url']
                          if url not in seen:
                              seen.append(url)
                              print('RESPONSE',p.get('type'),p['response']['status'],url)
                  except Exception:
                      pass
              pathlib.Path('response-urls.txt').write_text('\n'.join(seen),encoding='utf-8')
          finally:
              driver.quit()
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lenso-results
          if-no-files-found: warn
          path: |
            photo.jpg
            lenso-results.html
            lenso-results.png
            lenso-body.txt
            lenso-links.json
            performance.json
            response-urls.txt
