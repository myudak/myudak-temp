name: Reverse image lookup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reverse-image.yml'
  pull_request:

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and upscale JPEG
        run: |
          python - <<'PY'
          import base64, re, pathlib
          text = pathlib.Path('ctf-photo.svg').read_text()
          data = re.search(r'base64,([^\"]+)', text).group(1)
          pathlib.Path('photo-small.jpg').write_bytes(base64.b64decode(data))
          PY
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq imagemagick || true
          if command -v magick >/dev/null 2>&1; then
            magick photo-small.jpg -resize 800x -quality 95 photo.jpg || true
          elif command -v convert >/dev/null 2>&1; then
            convert photo-small.jpg -resize 800x -quality 95 photo.jpg || true
          fi
          if [ ! -s photo.jpg ]; then cp photo-small.jpg photo.jpg; fi
          file photo.jpg || true
          ls -lh photo.jpg

      - name: Yandex reverse image search
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'
          curl -sS -A "$UA" -D yandex-upload-headers.txt \
            -F 'upfile=@photo.jpg;type=image/jpeg' \
            'https://yandex.com/images-apphost/image-download' \
            -o yandex-upload.json || true
          echo '=== YANDEX UPLOAD HEADERS ==='
          cat yandex-upload-headers.txt || true
          echo '=== YANDEX UPLOAD BODY ==='
          head -c 4000 yandex-upload.json || true
          python - <<'PY'
          import json, pathlib, urllib.parse
          p=pathlib.Path('yandex-upload.json')
          try:
              data=json.loads(p.read_text())
          except Exception as e:
              print('Yandex JSON error:',e)
              pathlib.Path('yandex-search-url.txt').write_text('')
              raise SystemExit
          params={'rpt':'imageview','url':data.get('url','')}
          image_id=data.get('id') or data.get('image_id')
          if image_id: params['cbir_id']=image_id
          url='https://yandex.com/images/search?'+urllib.parse.urlencode(params)
          pathlib.Path('yandex-search-url.txt').write_text(url)
          print('SEARCH_URL='+url)
          PY
          if [ -s yandex-search-url.txt ]; then
            curl -sS -L -A "$UA" -D yandex-search-headers.txt "$(cat yandex-search-url.txt)" -o yandex.html || true
          fi
          echo '=== YANDEX TITLE ==='
          grep -o '<title[^>]*>[^<]*' yandex.html 2>/dev/null | head -5 || true
          echo '=== YANDEX RESULT URLS/TEXT ==='
          python - <<'PY'
          import re, html, pathlib
          p=pathlib.Path('yandex.html')
          if not p.exists(): raise SystemExit
          s=html.unescape(p.read_text(errors='ignore'))
          pats=[r'"url":"(https?://[^\"]+)"',r'"source_url":"(https?://[^\"]+)"',r'"page_url":"(https?://[^\"]+)"',r'"title":"([^\"]{4,200})"',r'liberat[^\"<>]{0,180}',r'1944[^\"<>]{0,180}',r'commune[^\"<>]{0,180}']
          for pat in pats:
              print('\nPATTERN',pat)
              seen=[]
              for x in re.findall(pat,s,re.I):
                  if isinstance(x,tuple): x=' '.join(x)
                  x=x.replace('\\/','/')
                  if x not in seen: seen.append(x)
                  if len(seen)>=100: break
              print('\n'.join(seen))
          PY

      - name: Google Lens upload endpoint
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'
          curl -sS -L -A "$UA" \
            -D lens-headers.txt \
            -F 'encoded_image=@photo.jpg;type=image/jpeg' \
            -F 'sbisrc=Chromium' \
            'https://lens.google.com/v3/upload' \
            -o lens.html || true
          echo '=== LENS HEADERS ==='
          cat lens-headers.txt || true
          echo '=== LENS TITLE ==='
          grep -o '<title[^>]*>[^<]*' lens.html | head -5 || true
          echo '=== LENS URLS/TEXT ==='
          python - <<'PY'
          import re, html, pathlib
          p=pathlib.Path('lens.html')
          if not p.exists(): raise SystemExit
          s=html.unescape(p.read_text(errors='ignore'))
          pats=[r'https?://[^\"<> ]+',r'liberat[^\"<>]{0,180}',r'1944[^\"<>]{0,180}',r'commune[^\"<>]{0,180}']
          for pat in pats:
              print('\nPATTERN',pat)
              seen=[]
              for x in re.findall(pat,s,re.I):
                  if x not in seen: seen.append(x)
                  if len(seen)>=100: break
              print('\n'.join(seen))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reverse-search-results
          if-no-files-found: warn
          path: |
            photo.jpg
            photo-small.jpg
            yandex-upload.json
            yandex-upload-headers.txt
            yandex-search-url.txt
            yandex-search-headers.txt
            yandex.html
            lens.html
            lens-headers.txt
