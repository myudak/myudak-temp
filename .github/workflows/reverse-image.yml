name: Browser reverse image lookup

on:
  workflow_dispatch:
  pull_request:

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Extract image
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          text = ''.join(Path('original-photo.b64.1').read_text().split())
          data = base64.b64decode(text, validate=False)
          Path('photo.jpg').write_bytes(data)
          print('decoded bytes', len(data))
          PY
          file photo.jpg
          identify photo.jpg
          stat -c 'image bytes %s' photo.jpg

      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Run Bing, Google Lens and Yandex in Chromium
        continue-on-error: true
        run: |
          cat > reverse_browser.py <<'PY'
          import asyncio, json
          from pathlib import Path
          from playwright.async_api import async_playwright

          KEYWORDS = ('visual', 'insight', 'image', 'lens', 'search', 'similar', 'include', 'exact', 'api')

          async def run_engine(browser, name, url):
              context = await browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36',
                  locale='en-US',
                  viewport={'width': 1440, 'height': 1000},
              )
              page = await context.new_page()
              records = []

              async def save_response(resp):
                  u = resp.url
                  ctype = (resp.headers.get('content-type') or '').lower()
                  if any(k in u.lower() for k in KEYWORDS) and ('json' in ctype or 'html' in ctype or 'text' in ctype):
                      try:
                          body = await resp.text()
                      except Exception:
                          return
                      if body:
                          records.append({'url': u, 'status': resp.status, 'content_type': ctype, 'body': body[:500000]})

              page.on('response', lambda r: asyncio.create_task(save_response(r)))
              print(f'[{name}] opening {url}')
              try:
                  await page.goto(url, wait_until='domcontentloaded', timeout=90000)
                  await page.wait_for_timeout(4000)
                  print(f'[{name}] initial url={page.url} title={await page.title()}')
                  count = await page.locator('input[type=file]').count()
                  print(f'[{name}] file inputs={count}')
                  if count:
                      await page.locator('input[type=file]').first.set_input_files('photo.jpg')
                      await page.wait_for_timeout(30000)
                  print(f'[{name}] final url={page.url} title={await page.title()}')
                  Path(f'{name}.html').write_text(await page.content(), errors='ignore')
                  try:
                      text = await page.locator('body').inner_text(timeout=10000)
                  except Exception:
                      text = ''
                  Path(f'{name}.txt').write_text(text, errors='ignore')
                  await page.screenshot(path=f'{name}.png', full_page=True)
              except Exception as e:
                  Path(f'{name}-error.txt').write_text(repr(e))
                  print(f'[{name}] ERROR {e!r}')
              Path(f'{name}-responses.json').write_text(json.dumps(records, ensure_ascii=False))
              print(f'[{name}] captured responses={len(records)}')
              await context.close()

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  await run_engine(browser, 'bing-browser', 'https://www.bing.com/images')
                  await run_engine(browser, 'google-lens-browser', 'https://lens.google.com/')
                  await run_engine(browser, 'yandex-browser', 'https://yandex.com/images/')
                  await browser.close()

          asyncio.run(main())
          PY
          python reverse_browser.py
          echo '=== BING BODY ==='
          sed -n '1,300p' bing-browser.txt 2>/dev/null || true
          echo '=== GOOGLE LENS BODY ==='
          sed -n '1,300p' google-lens-browser.txt 2>/dev/null || true
          echo '=== YANDEX BODY ==='
          sed -n '1,300p' yandex-browser.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-reverse-results
          if-no-files-found: warn
          path: |
            photo.jpg
            *-browser.html
            *-browser.txt
            *-browser.png
            *-browser-responses.json
            *-browser-error.txt
