name: Reverse image lookup

on:
  workflow_dispatch:
  pull_request:

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and upscale JPEG
        run: |
          python - <<'PY'
          import base64, re, pathlib
          text = pathlib.Path('ctf-photo.svg').read_text()
          data = re.search(r'base64,([^\"]+)', text).group(1)
          pathlib.Path('photo-small.jpg').write_bytes(base64.b64decode(data))
          PY
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq imagemagick || true
          if command -v magick >/dev/null 2>&1; then
            magick photo-small.jpg -resize 800x -quality 95 photo.jpg || true
          elif command -v convert >/dev/null 2>&1; then
            convert photo-small.jpg -resize 800x -quality 95 photo.jpg || true
          fi
          if [ ! -s photo.jpg ]; then cp photo-small.jpg photo.jpg; fi
          file photo.jpg || true
          ls -lh photo.jpg

      - name: Upload temporary public JPEG
        continue-on-error: true
        run: |
          B64="$(base64 -w0 photo.jpg)"
          curl -sS -X POST \
            -F 'key=6d207e02198a847aa98d0a2a901485a5' \
            -F "source=$B64" \
            -F 'format=json' \
            'https://freeimage.host/api/1/upload' \
            -o freeimage.json
          cat freeimage.json
          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('freeimage.json').read_text())
          im=d.get('image',{})
          url=im.get('url') or im.get('display_url') or im.get('url_viewer') or ''
          pathlib.Path('public-url.txt').write_text(url)
          print('PUBLIC_URL='+url)
          PY

      - name: Search public image URL
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'
          URL="$(cat public-url.txt)"
          ENC="$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$URL")"
          echo "URL=$URL"
          curl -sS -L -A "$UA" "https://lens.google.com/uploadbyurl?url=$ENC&ep=subb" -o lens-url.html || true
          curl -sS -L -A "$UA" "https://www.google.com/searchbyimage?image_url=$ENC&client=app" -o google-url.html || true
          curl -sS -L -A "$UA" "https://www.bing.com/images/searchbyimage?cbir=sbi&imgurl=$ENC" -o bing.html || true
          curl -sS -L -A "$UA" "https://tineye.com/search?url=$ENC" -o tineye.html || true
          curl -sS -L -A "$UA" "https://yandex.com/images/search?rpt=imageview&url=$ENC" -o yandex-url.html || true
          python - <<'PY'
          import re, html, pathlib
          for fn in ['lens-url.html','google-url.html','bing.html','tineye.html','yandex-url.html']:
              p=pathlib.Path(fn)
              print('\n\n===== '+fn+' =====')
              if not p.exists():
                  print('MISSING'); continue
              s=html.unescape(p.read_text(errors='ignore'))
              titles=re.findall(r'<title[^>]*>(.*?)</title>',s,re.I|re.S)
              print('TITLE:', [re.sub('<.*?>','',x)[:300] for x in titles[:3]])
              pats=[
                r'https?://[^\"<> ]+',
                r'"title":"([^\"]{4,250})"',
                r'"name":"([^\"]{4,250})"',
                r'liberat[^\"<>]{0,220}',r'1944[^\"<>]{0,220}',r'commune[^\"<>]{0,220}',
                r'France[^\"<>]{0,160}',r'Belgium[^\"<>]{0,160}',r'Normandy[^\"<>]{0,160}'
              ]
              for pat in pats:
                  vals=[]
                  for x in re.findall(pat,s,re.I):
                      if isinstance(x,tuple): x=' '.join(x)
                      x=x.replace('\\/','/')
                      if x not in vals: vals.append(x)
                      if len(vals)>=80: break
                  if vals:
                      print('\nPATTERN',pat)
                      print('\n'.join(vals))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reverse-search-results
          if-no-files-found: warn
          path: |
            photo.jpg
            freeimage.json
            public-url.txt
            lens-url.html
            google-url.html
            bing.html
            tineye.html
            yandex-url.html
