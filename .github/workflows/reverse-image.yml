name: Reverse image lookup

on:
  workflow_dispatch:
  pull_request:

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract image and make crops
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          python - <<'PY'
          import base64, re, pathlib
          text = pathlib.Path('ctf-photo.svg').read_text()
          data = re.search(r'base64,([^\"]+)', text).group(1)
          pathlib.Path('full-small.jpg').write_bytes(base64.b64decode(data))
          PY
          convert full-small.jpg -resize 1000x full.jpg
          convert full-small.jpg -crop 180x220+80+45 +repage -resize 900x central.jpg
          convert full-small.jpg -crop 240x200+0+45 +repage -resize 900x left.jpg
          identify full.jpg central.jpg left.jpg

      - name: Pinterest visual searches
        run: |
          for IMG in full.jpg central.jpg left.jpg; do
            BASE="${IMG%.jpg}"
            echo "===== SEARCH $IMG ====="
            curl -sS -X PUT \
              -F "image=@$IMG;type=image/jpeg" \
              -F 'x=0' -F 'y=0' -F 'w=1' -F 'h=1' \
              -F 'base_scheme=https' \
              'https://api.pinterest.com/v3/visual_search/extension/image/' \
              -o "pinterest-$BASE.json"
            python - "$BASE" <<'PY'
          import json, pathlib, sys
          base=sys.argv[1]
          p=pathlib.Path('pinterest-'+base+'.json')
          print('bytes',p.stat().st_size)
          try: d=json.loads(p.read_text())
          except Exception as e:
              print('JSON ERROR',e); print(p.read_text(errors='ignore')[:4000]); raise SystemExit
          print('status',d.get('status'),'message',d.get('message'))
          data=d.get('data') or []
          print('results',len(data))
          for i,item in enumerate(data[:200]):
              print('RESULT',i)
              print('id=',item.get('id'))
              print('description=',repr(item.get('description')))
              print('link=',item.get('link') or item.get('domain') or item.get('source'))
              print('image=',item.get('image_large_url') or item.get('image_medium_url') or item.get('image_url'))
              print('raw=',json.dumps(item,ensure_ascii=False)[:1500])
          PY
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinterest-results
          if-no-files-found: warn
          path: |
            full.jpg
            central.jpg
            left.jpg
            pinterest-*.json
