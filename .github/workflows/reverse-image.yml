name: Lenso reverse image lookup

on:
  workflow_dispatch:
  pull_request:

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and enlarge image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          python - <<'PY'
          import base64, re, pathlib
          text = pathlib.Path('ctf-photo.svg').read_text()
          data = re.search(r'base64,([^\"]+)', text).group(1)
          pathlib.Path('photo-small.jpg').write_bytes(base64.b64decode(data))
          PY
          convert photo-small.jpg -resize 1200x -quality 96 photo.jpg
          identify photo.jpg

      - name: Search with lenso.ai
        continue-on-error: true
        run: |
          python -m pip install -q selenium
          python - <<'PY'
          import json, pathlib, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1600,1200')
          opts.add_argument('--lang=en-US')
          opts.add_argument('--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36')
          opts.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})

          driver=webdriver.Chrome(options=opts)
          driver.execute_cdp_cmd('Network.enable', {})
          try:
              driver.get('https://lenso.ai/en')
              time.sleep(8)
              print('HOME_URL',driver.current_url)
              print('HOME_TITLE',driver.title)
              inputs=driver.find_elements(By.CSS_SELECTOR,'input')
              print('INPUT_COUNT',len(inputs))
              for i,el in enumerate(inputs):
                  print('INPUT',i,el.get_attribute('type'),el.get_attribute('name'),el.get_attribute('accept'),el.get_attribute('class'))
              buttons=driver.find_elements(By.CSS_SELECTOR,'button')
              for i,b in enumerate(buttons[:80]):
                  try: print('BUTTON',i,repr(b.text),b.get_attribute('aria-label'),b.get_attribute('class'))
                  except: pass
              file_inputs=driver.find_elements(By.CSS_SELECTOR,'input[type=file]')
              if not file_inputs:
                  pathlib.Path('lenso-home.html').write_text(driver.page_source,encoding='utf-8')
                  driver.save_screenshot('lenso-home.png')
                  raise RuntimeError('No file input found')
              image_path=str(pathlib.Path('photo.jpg').resolve())
              file_inputs[0].send_keys(image_path)
              print('UPLOADED',image_path)
              for sec in range(1,61):
                  time.sleep(1)
                  if sec in (5,10,20,30,45,60):
                      print('WAIT',sec,'URL',driver.current_url,'TITLE',driver.title)
              pathlib.Path('lenso-results.html').write_text(driver.page_source,encoding='utf-8')
              driver.save_screenshot('lenso-results.png')
              try:
                  body=driver.find_element(By.TAG_NAME,'body').text
              except Exception:
                  body=''
              pathlib.Path('lenso-body.txt').write_text(body,encoding='utf-8')
              print('FINAL_URL',driver.current_url)
              print('BODY_START')
              print(body[:50000])
              print('BODY_END')
              links=[]
              for a in driver.find_elements(By.TAG_NAME,'a'):
                  href=a.get_attribute('href')
                  text=(a.text or '').strip()
                  if href: links.append({'text':text[:500],'href':href})
              pathlib.Path('lenso-links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2),encoding='utf-8')
              for x in links[:500]: print('LINK',repr(x['text']),x['href'])

              perf=driver.get_log('performance')
              pathlib.Path('performance.json').write_text(json.dumps(perf),encoding='utf-8')
              seen=[]
              for entry in perf:
                  try:
                      msg=json.loads(entry['message'])['message']
                      if msg['method']=='Network.responseReceived':
                          p=msg['params']
                          url=p['response']['url']
                          typ=p.get('type')
                          if url not in seen:
                              seen.append(url)
                              print('RESPONSE',typ,p['response']['status'],url)
                  except Exception:
                      pass
          finally:
              driver.quit()
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lenso-results
          if-no-files-found: warn
          path: |
            photo.jpg
            lenso-home.html
            lenso-home.png
            lenso-results.html
            lenso-results.png
            lenso-body.txt
            lenso-links.json
            performance.json
